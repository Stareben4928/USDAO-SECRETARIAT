<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"></head><body>
<title>SECRETARIAT USDAO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Mise en page : colonne latérale bleu nuit + zone de travail grise, orange réservé aux actions et alertes. */
:root{
  --night:#101c36; --side:#101c36; --side2:#1a2a4d; --side-ink:#c9d1e3; --side-act:rgba(240,138,36,.18);
  --orange:#f08a24; --orange-ink:#a8500a; --orange-soft:rgba(240,138,36,.15);
  --bg:#e8eaee; --panel:#ffffff; --soft:#f2f3f6; --line:#d2d6de;
  --ink:#14213d; --muted:#5b6579;
  --blue-soft:#dde4f4; --blue-ink:#1c2f5c;
  --l3bg:#101c36; --l3fg:#ffffff; --danger:#a82a22;
  --shadow:0 18px 50px rgba(7,14,29,.35);
  --on-accent:#101c36; --r:12px; --r-sm:9px; --fs:15px;
  --font:"Avenir Next","Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --side:#070e1d; --side2:#14213f; --side-ink:#b6c0d8;
  --orange-ink:#f6a04b; --orange-soft:rgba(240,138,36,.18);
  --bg:#0b1428; --panel:#121e38; --soft:#0f1a32; --line:#233356;
  --ink:#e8ebf2; --muted:#9ba6bd;
  --blue-soft:#1b2c52; --blue-ink:#b4c4ea; --l3bg:#f08a24; --l3fg:#101c36; --danger:#ff8d84;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --side:#070e1d; --side2:#14213f; --side-ink:#b6c0d8;
  --orange-ink:#f6a04b; --orange-soft:rgba(240,138,36,.18);
  --bg:#0b1428; --panel:#121e38; --soft:#0f1a32; --line:#233356;
  --ink:#e8ebf2; --muted:#9ba6bd;
  --blue-soft:#1b2c52; --blue-ink:#b4c4ea; --l3bg:#f08a24; --l3fg:#101c36; --danger:#ff8d84;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:var(--fs)/1.5 var(--font);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.shell{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink)}
.side-in{position:sticky;top:env(safe-area-inset-top,0px);max-height:100vh;overflow:auto;display:flex;flex-direction:column;gap:22px;
  padding-block:24px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:42px;height:42px;border-radius:11px;background:var(--orange);display:grid;place-items:center;color:var(--on-accent);flex:none}
.mark svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand b{display:block;color:#fff;font-size:17px;letter-spacing:.14em;line-height:1.1}
.brand span{display:block;color:var(--orange);font-size:12px;font-weight:700;letter-spacing:.42em;margin-top:3px}
nav{display:flex;flex-direction:column;gap:3px}
.nav-i{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border:0;border-radius:var(--r-sm);background:transparent;color:var(--side-ink);text-align:left;cursor:pointer;white-space:nowrap}
.nav-i:hover{background:var(--side2)}
.nav-i[aria-current="page"]{background:var(--side-act);color:#fff}
.nav-i[aria-current="page"] svg{color:var(--orange)}
.nav-i .n{margin-left:auto;font-size:12px;color:#8e9ab8;font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;font-size:12.5px;color:#8e9ab8;line-height:1.5;border-top:1px solid var(--side2);padding-top:16px}
.side-foot b{color:#d9deea;font-weight:600}

.main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px;min-width:0}
.wrap{max-width:1160px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:10px;align-items:center;padding-block:14px}
.search{flex:1;min-width:0;position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;padding:10px 12px 10px 38px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel)}
.net{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;padding:8px 12px;border-radius:99px;background:var(--panel);border:1px solid var(--line);white-space:nowrap}
.net::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.net.on::before{background:var(--orange)}

.vh{display:flex;gap:16px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;margin:10px 0 18px}
.vh h1{font-size:28px;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
.vh p{color:var(--muted);margin-top:4px}
.vh-a{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.primary.danger{background:var(--danger);border-color:var(--danger);color:#fff}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:18px}
.stat{text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:14px 16px}
.stat:hover{border-color:var(--orange)}
.stat b{font-size:32px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-bottom:14px}
.cols>*{min-width:0}
.card h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}

.list{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;min-width:0}
.row:last-child{border-bottom:0}
.row:hover{background:var(--soft)}
.r-main{min-width:0;flex:1 1 260px}
.r-ref{font:600 11.5px var(--mono);color:var(--muted);letter-spacing:.04em}
.r-title{font-weight:650;overflow-wrap:anywhere}
.r-sub{font-size:13px;color:var(--muted)}
.r-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.mini{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px}
.mini:last-child{border-bottom:0}
.mini .t{min-width:0;overflow-wrap:anywhere}
.mini .s{color:var(--muted);font-size:12.5px;white-space:nowrap}
.late{color:var(--orange-ink);font-weight:700}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:var(--r);padding:32px 20px;display:flex;flex-direction:column;gap:4px;text-align:center;color:var(--muted)}
.empty strong{color:var(--ink)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select{padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel);max-width:100%}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:650;padding:2px 9px;border-radius:99px;border:1px solid var(--line);background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.l1,.pill.s-ouvert,.pill.s-inscrit,.pill.s-traite{background:var(--blue-soft);color:var(--blue-ink);border-color:transparent}
.pill.l2,.pill.s-en-cours,.pill.s-a-traiter,.pill.s-haute{background:var(--orange-soft);color:var(--orange-ink);border-color:var(--orange)}
.pill.l3{background:var(--l3bg);color:var(--l3fg);border-color:var(--l3bg)}
.pill.s-clos,.pill.s-classe,.pill.s-basse{background:transparent}
.tag{font:700 10px var(--font);letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border-radius:5px;background:var(--soft);border:1px solid var(--line);color:var(--muted)}
.lockedtxt{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-style:italic}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.cards>*{min-width:0}
.ct{display:flex;flex-direction:column;gap:10px}
.ct-h{display:flex;gap:12px;align-items:center}
.av{width:44px;height:44px;border-radius:50%;background:var(--night);color:#fff;display:grid;place-items:center;font-weight:700;letter-spacing:.04em;flex:none}
.ct b{display:block;overflow-wrap:anywhere}
.ct small{color:var(--muted)}
.kv{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:13.5px;min-width:0}
.kv span{overflow-wrap:anywhere;min-width:0}
.kv i{font-style:normal;color:var(--muted);font-size:12px;flex:none}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}

.sec{margin-bottom:22px}
.sec>h2{font-size:15px;margin-bottom:10px}
.item{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.ico{width:36px;height:36px;border-radius:var(--r-sm);background:var(--soft);display:grid;place-items:center;color:var(--muted);flex:none}
.i-main{flex:1 1 220px;min-width:0}
.i-t{font-weight:600;overflow-wrap:anywhere}
.i-s{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.i-act{display:flex;gap:6px;flex-wrap:wrap}
.drop{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--muted);cursor:pointer;margin-bottom:12px;text-align:center}
.drop:hover,.drop.over{border-color:var(--orange);color:var(--ink);background:var(--orange-soft)}

.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 10px 8px 0}
.tbl td{padding:9px 10px 9px 0;border-top:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}

.modal{position:fixed;inset:0;z-index:50;background:rgba(7,14,29,.62);overflow:auto;display:flex;justify-content:center;
  padding-block:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dlg{background:var(--panel);border-radius:calc(var(--r) + 2px);width:min(560px,100%);margin:auto 0;box-shadow:var(--shadow);min-width:0}
.dlg.wide{width:min(820px,100%)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dlg-h h2{font-size:17px;overflow-wrap:anywhere}
.x{border:0;background:transparent;font-size:26px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 8px}
.dlg-b{padding:20px;min-width:0}
.dlg-b h3.dt{font-size:21px;margin:10px 0 14px;overflow-wrap:anywhere}
.dlg-b h4{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:0 0 20px}
.meta dt{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.meta dd{margin:2px 0 0;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 18px}
.chip{padding:3px 10px;border-radius:99px;background:var(--soft);border:1px solid var(--line);font-size:13px}
.notes{white-space:pre-wrap;margin:8px 0 18px;overflow-wrap:anywhere}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:20px 0 8px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld label{font-size:13px;font-weight:600}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel)}
.fld textarea{resize:vertical}
.checks{display:flex;gap:6px 14px;flex-wrap:wrap}
.chk{display:flex;gap:6px;align-items:center;font-weight:400!important}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.actions.between{justify-content:space-between}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.lv{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom,0px));z-index:60;background:var(--night);color:#fff;padding:10px 16px;border-radius:var(--r-sm);box-shadow:var(--shadow);max-width:calc(100% - 32px);font-size:14px;border:1px solid var(--orange)}

.nav-g{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7f8cab;margin:16px 12px 4px}
.nav-g:first-child{margin-top:0}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--panel);cursor:pointer;font-weight:600;font-size:14px}
.opt:hover{border-color:var(--muted)}
.opt.on{border-color:var(--orange);background:var(--orange-soft)}
.sw{width:18px;height:18px;border-radius:50%;display:inline-block;border:1px solid rgba(128,128,128,.45);flex:none}
.set-g{margin-bottom:18px}
.set-g h3{font-size:14px;margin-bottom:8px}
.agenda{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:16px;align-items:start}
.agenda>*{min-width:0}
.cal-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-w{text-align:center;font-size:11px;color:var(--muted);letter-spacing:.08em;font-weight:700}
.cal-d{min-height:40px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:0;font-variant-numeric:tabular-nums}
.cal-d:hover{border-color:var(--orange)}
.cal-d.blank{border:0;background:transparent;cursor:default}
.cal-d.today{border-color:var(--orange);font-weight:800}
.cal-d.sel{background:var(--orange);border-color:var(--orange);color:var(--on-accent)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--orange)}
.dot.off{background:transparent}
.cal-d.sel .dot{background:var(--on-accent)}
.cal-d.sel .dot.off{background:transparent}
.day-h{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:16px 0 6px}
.day-h:first-child{margin-top:0}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer;flex:none;color:transparent;padding:0}
.tick svg{width:15px;height:15px;stroke-width:2.4}
.tick:hover{border-color:var(--orange)}
.tick[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:var(--on-accent)}
.row.done .r-title{text-decoration:line-through;color:var(--muted)}
:root[data-font="classique"]{--font:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
:root[data-font="lisible"]{--font:"Trebuchet MS","Segoe UI",Verdana,sans-serif}
:root[data-size="grand"]{--fs:17px}
:root[data-radius="droit"]{--r:3px;--r-sm:2px}
:root[data-radius="arrondi"]{--r:20px;--r-sm:14px}
:root[data-density="compact"] .row{padding:7px 14px}
:root[data-density="compact"] .card{padding:13px}
:root[data-density="compact"] .item{padding:6px 0}
:root[data-density="compact"] .mini{padding:6px 0}
:root[data-density="compact"] .nav-i{padding:7px 12px}
:root[data-density="compact"] .stat{padding:10px 14px}
:root[data-density="compact"] .vh{margin-bottom:12px}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side-in{position:static;max-height:none;padding-block:14px 10px;gap:12px}
  nav{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .nav-i{width:auto}
  .side-foot{display:none}
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .vh h1{font-size:23px}
  .net span{display:none}
  .nav-g{display:none}
  .agenda{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="shell">
  <aside class="side"><div class="side-in">
    <div class="brand">
      <div class="mark"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M8 13h8"/></svg></div>
      <div><b>SECRETARIAT</b><span>USDAO</span></div>
    </div>
    <nav id="nav" aria-label="Rubriques"></nav>
    <div class="side-foot" id="sidefoot"></div>
  </div></aside>
  <div class="main"><div class="wrap">

      <div class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>

</div>
<div id="modal" class="modal" hidden><div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="mt">

<div id="toast" class="toast" role="status" hidden></div>

<script>
(function(){
'use strict';
/* ---------- utilitaires ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const fmtDate=d=>d?new Date(d).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'}):'—';
const fmtTime=d=>new Date(d).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'});
const fmtSize=n=>n<1024?n+' o':n<1048576?Math.round(n/1024)+' Ko':(n/1048576).toFixed(1)+' Mo';
const IC={

/* ---------- stockage local (IndexedDB, repli mémoire) ---------- */
const STORES=['dossiers','contacts','adresses','documents','liens','etudiants','courriers','evenements','taches','modeles','journal','meta'];
let db=null,mem=false;const memory={};
function openDB(){return new Promise(res=>{try{
  const r=indexedDB.open('secretaire-usdao',2);
  r.onupgradeneeded=()=>{STORES.forEach(s=>{if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:'id'})})};
  r.onsuccess=()=>{db=r.result;res()};
  r.onerror=()=>{mem=true;res()};
  r.onblocked=()=>{mem=true;res()};
}catch(e){mem=true;res()}})}
const os=(s,m)=>db.transaction(s,m).objectStore(s);
const dbAll=s=>mem?Promise.resolve([...(memory[s]||[])]):new Promise((ok,ko)=>{const r=os(s,'readonly').getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)});
const dbPut=(s,o)=>{if(mem){memory[s]=(memory[s]||[]).filter(x=>x.id!==o.id).concat([o]);return Promise.resolve()}
  return new Promise((ok,ko)=>{const t=db.transaction(s,'readwrite');t.objectStore(s).put(o);t.oncomplete=ok;t.onerror=()=>ko(t.error);t.onabort=()=>ko(t.error)})};
const dbDel=(s,id)=>{if(mem){memory[s]=(memory[s]||[]).filter(x=>x.id!==id);return Promise.resolve()}
  return new Promise((ok,ko)=>{const t=db.transaction(s,'readwrite');t.objectStore(s).delete(id);t.oncomplete=ok;t.onerror=()=>ko(t.error)})};
const dbClear=s=>{if(mem){memory[s]=[];return Promise.resolve()}
  return new Promise((ok,ko)=>{const t=db.transaction(s,'readwrite');t.objectStore(s).clear();t.oncomplete=ok;t.onerror=()=>ko(t.error)})};

const toDataURL=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
function fromDataURL(u){const p=u.split(',');const mime=(p[0].match(/:(.*?);/)||[0,'application/octet-stream'])[1];const bin=atob(p[1]);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:mime})}
async function hashPin(pin,salt){const data=new TextEncoder().encode(salt+':'+pin);
  try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',data);return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}
  let h=5381;for(const c of salt+pin)h=((h<<5)+h+c.charCodeAt(0))>>>0;return 'x'+h}

/* ---------- données : fichiers, export, import ---------- */
async function addFiles(files,dossierId,level){
  if(!files||!files.length)return;
  const d=dossierId?byId(S.dossiers,dossierId):null;const lv=level!=null&&level!==''?+level:(d?d.level||0:0);
  for(const f of files){await save('documents',{id:uid(),name:f.name,size:f.size,type:f.type,blob:f,dossierId:dossierId||'',level:lv,archived:false});await log('Ajout document',f.name)}
  toast(files.length+' fichier(s) enregistré(s) sur cet appareil.');
  if(S.detail)showDetail(S.detail);else render();
}
async function buildPack(dossierIds){
  const ds=dossierIds?S.dossiers.filter(d=>dossierIds.indexOf(d.id)>=0):S.dossiers;
  const ids=ds.map(d=>d.id);
  const docs=dossierIds?S.documents.filter(x=>ids.indexOf(x.dossierId)>=0):S.documents;
  const liens=dossierIds?S.liens.filter(x=>ids.indexOf(x.dossierId)>=0):S.liens;
  const cIds=dossierIds?[].concat.apply([],ds.map(d=>d.contactIds||[])):null;
  const contacts=dossierIds?S.contacts.filter(c=>cIds.indexOf(c.id)>=0):S.contacts;
  const adresses=dossierIds?S.adresses.filter(a=>contacts.some(c=>c.addressId===a.id)):S.adresses;
  const sub=k=>dossierIds?S[k].filter(x=>ids.indexOf(x.dossierId)>=0):S[k];
  const outDocs=[];for(const x of docs){const m=Object.assign({},x);delete m.blob;m.data=await toDataURL(x.blob);outDocs.push(m)}
  return {app:'SECRETARIAT USDAO',version:2,date:new Date().toISOString(),dossiers:ds,contacts:contacts,adresses:adresses,liens:liens,documents:outDocs,etudiants:sub('etudiants'),courriers:sub('courriers'),evenements:sub('evenements'),taches:sub('taches'),modeles:dossierIds?[]:S.modeles};
}
async function exportPack(dossierIds,name){
  requireUnlock(async()=>{
    toast('Préparation du fichier…');
    const pack=await buildPack(dossierIds);
    download(new Blob([JSON.stringify(pack)],{type:'application/json'}),name+'.usdao.json');
    await log('Export',name);toast('Fichier d\'export créé.');
  });
}
async function importPack(file){
  try{
    const p=JSON.parse(await file.text());
    if(p.app!=='SECRETARIAT USDAO'&&p.app!=='SECRETAIRE USDAO')throw new Error('format');
    let n=0;
    for(const k of ['contacts','adresses','dossiers','liens','etudiants','courriers','evenements','taches','modeles']){for(const o of (p[k]||[])){await save(k,o);n++}}
    for(const x of (p.documents||[])){const o=Object.assign({},x);o.blob=fromDataURL(x.data);delete o.data;await save('documents',o);n++}
    await log('Import',file.name);toast(n+' élément(s) importé(s).');render();
  }catch(e){toast('Fichier non reconnu. Choisissez un export de SECRETAIRE USDAO.')}
}
function nextRef(){const y=new Date().getFullYear();const re=new RegExp('^USDAO-'+y+'-(\\d+)$');const n=S.dossiers.map(d=>{const m=String(d.ref).match(re);return m?+m[1]:0});return 'USDAO-'+y+'-'+String(Math.max.apply(null,[0].concat(n))+1).padStart(3,'0')}
async function setArchived(kind,id,val){
  if(kind==='dossier'){const d=byId(S.dossiers,id);d.archived=val;await save('dossiers',d);
    for(const x of S.documents.filter(x=>x.dossierId===id)){x.archived=val;await save('documents',x)}
    for(const x of S.liens.filter(x=>x.dossierId===id)){x.archived=val;await save('liens',x)}
    await log(val?'Archivage':'Restauration','Dossier '+d.ref)}
  else{const k=kind==='doc'?'documents':'liens';const x=byId(S[k],id);x.archived=val;await save(k,x);await log(val?'Archivage':'Restauration',kind==='doc'?x.name:x.title)}

async function purge(kind,id){

function applyUI(){
  const u=S.settings.ui,r=document.documentElement,dark=isDark();
  if(u.theme==='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',u.theme);
  ['font','size','density','radius'].forEach(k=>r.setAttribute('data-'+k,u[k]));
  const a=ACC[u.accent]||ACC.orange,s=SIDE[u.side]||SIDE.nuit,sp=dark?s.d:s.l;

function rowEv(e){if(locked(e))return maskRow(e.level);const d=byId(S.dossiers,e.dossierId);
  const t=e.start?e.start+(e.end?' – '+e.end:''):'Journée';
  return '<div class="row" data-act="edit-ent" data-k="evenements" data-id="'+e.id+'" tabindex="0" role="button"><div class="r-main"><div class="r-ref">'+esc(t)+demoTag(e)+'</div><div class="r-title">'+esc(e.title)+'</div><div class="r-sub">'+esc([e.place,e.participants].filter(Boolean).join(' · '))+'</div></div><div class="r-meta"><span class="pill">'+esc(e.type)+'</span>'+lvl(e.level)+(d&&!locked(d)?'<span>'+esc(d.ref)+'</span>':'')+'</div></div>'}
function vAgenda(){
  const off=+S.f.mo||0,b=new Date();b.setDate(1);b.setMonth(b.getMonth()+off);const y=b.getFullYear(),m=b.getMonth(),td=today();
  const lead=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),cnt={};
  S.evenements.forEach(e=>{cnt[e.date]=(cnt[e.date]||0)+1});
  let cells='';for(let i=0;i<lead;i++)cells+='<span class="cal-d blank"></span>';
  for(let d=1;d<=dim;d++){const iso=y+'-'+pad(m+1)+'-'+pad(d);cells+='<button class="cal-d'+(iso===td?' today':'')+(S.f.day===iso?' sel':'')+'" data-act="cal-day" data-id="'+iso+'" aria-label="'+d+' '+b.toLocaleDateString('fr-FR',{month:'long'})+(cnt[iso]?', '+cnt[iso]+' événement(s)':'')+'">'+d+'<i class="dot'+(cnt[iso]?'':' off')+'"></i></button>'}
  let l=S.evenements.slice();
  if(S.f.day)l=l.filter(e=>e.date===S.f.day);else if(S.f.when==='passes')l=l.filter(e=>e.date<td);else if(S.f.when!=='tous')l=l.filter(e=>e.date>=td);
  if(S.q)l=l.filter(e=>hit(e,['title','place','participants','notes']));
  l.sort((a,c)=>(a.date+(a.start||'')).localeCompare(c.date+(c.start||'')));if(S.f.when==='passes'&&!S.f.day)l.reverse();
  const groups=[];l.forEach(e=>{let g=groups[groups.length-1];if(!g||g.d!==e.date){g={d:e.date,r:[]};groups.push(g)}g.r.push(e)});
  const list=groups.map(g=>'<div class="day-h">'+new Date(g.d+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+(g.d===td?' · aujourd\'hui':'')+'</div><div class="list">'+g.r.map(rowEv).join('')+'</div>').join('');
  return head('Agenda',l.length+' rendez-vous affiché(s)','<button class="btn primary" data-act="new-ent" data-k="evenements">'+ic('plus')+'Nouveau rendez-vous</button>')
   +'<div class="agenda"><section class="card"><div class="cal-h"><button class="btn sm" data-act="cal-nav" data-id="-1" aria-label="Mois précédent">‹</button><b style="text-transform:capitalize">'+b.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})+'</b><button class="btn sm" data-act="cal-nav" data-id="1" aria-label="Mois suivant">›</button></div>'
   +'<div class="cal-g">'+['L','M','M','J','V','S','D'].map(x=>'<span class="cal-w">'+x+'</span>').join('')+cells+'</div><p class="note">'+(S.f.day?'Jour sélectionné. Touchez-le de nouveau pour revenir à la liste.':'Touchez un jour pour voir ses rendez-vous.')+'</p></section>'
   +'<section><div class="filters">'+selNB('when','avenir',[['avenir','À venir'],['passes','Passés'],['tous','Tous']])+'</div>'+(list||empty('Aucun rendez-vous','Planifiez réunions, examens, soutenances et rendez-vous.'))+'</section></div>';
}

/* tâches */
function vTaches(){
  let l=S.taches.slice();const w=S.f.tw||'ouvertes',td=today();
  if(w==='ouvertes')l=l.filter(x=>!x.done);else if(w==='faites')l=l.filter(x=>x.done);
  if(S.q)l=l.filter(x=>hit(x,['title','notes']));
  const po={Haute:0,Normale:1,Basse:2};
  l.sort((a,b)=>((a.done?1:0)-(b.done?1:0))||(a.due||'9999').localeCompare(b.due||'9999')||((po[a.priority]||1)-(po[b.priority]||1)));
  const row=x=>{const d=byId(S.dossiers,x.dossierId),late=x.due&&x.due<td&&!x.done;
    return '<div class="row'+(x.done?' done':'')+'" style="cursor:default"><button class="tick" data-act="toggle-tache" data-id="'+x.id+'" aria-pressed="'+(!!x.done)+'" aria-label="'+(x.done?'Marquer comme à faire':'Marquer comme faite')+'">'+ic('check')+'</button><div class="r-main" data-act="edit-ent" data-k="taches" data-id="'+x.id+'" tabindex="0" role="button" style="cursor:pointer"><div class="r-title">'+esc(x.title)+demoTag(x)+'</div><div class="r-sub">'+(d&&!locked(d)?esc(d.ref):'')+'</div></div><div class="r-meta"><span class="pill s-'+slug(x.priority)+'">'+esc(x.priority)+'</span>'+(x.due?'<span class="'+(late?'late':'')+'">'+(late?'En retard · ':'')+fmtDate(x.due)+'</span>':'')+'</div></div>'};
  return head('Tâches',l.length+' tâche(s)','<button class="btn primary" data-act="new-ent" data-k="taches">'+ic('plus')+'Nouvelle tâche</button>')
   +'<div class="filters">'+selNB('tw','ouvertes',[['ouvertes','À faire'],['faites','Terminées'],['toutes','Toutes']])+'</div>'
   +(l.length?'<div class="list">'+l.map(row).join('')+'</div>':empty('Aucune tâche','Notez ce qu\'il reste à faire et rattachez-le à un dossier.'));
}

async function seed2(){
  if(S.settings.seeded2)return;S.settings.seeded2=true;
  const d1=S.dossiers.find(d=>d.demo&&/-001$/.test(d.ref));
  if(!S.dossiers.some(d=>d.demo)){await saveSettings();return}

/* ---------- événements ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const f=A[b.dataset.act];if(f){f(b.dataset.id,b,e)}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#modal').hidden){closeModal();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[data-act][role="button"]')){e.preventDefault();e.target.click()}
});
$('#modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('submit',e=>{
  const form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();
  const fn=F[form.dataset.form];if(fn)fn(new FormData(form),form.dataset.id,form);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.filter!=null&&t.dataset.filter!==''){S.f[t.dataset.filter]=t.value;renderMain();return}
  if(t.matches&&t.matches('[data-pick]')){const files=Array.from(t.files);const did=t.dataset.pick;addFiles(files,did,null).then(()=>{t.value=''});return}
  if(t.matches&&t.matches('[data-import]')){const f=t.files[0];if(f)importPack(f).then(()=>{t.value=''})}
});
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(z){e.preventDefault();z.classList.add('over')}});
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(z)z.classList.remove('over')});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(!z)return;e.preventDefault();z.classList.remove('over');addFiles(Array.from(e.dataTransfer.files),z.dataset.drop,null)});
$('#q').addEventListener('input',e=>{S.q=e.target.value.trim();renderMain()});
['click','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,bump,{passive:true}));
window.addEventListener('online',net);window.addEventListener('offline',net);
